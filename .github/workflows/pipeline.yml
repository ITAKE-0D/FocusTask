name: pipeline
on:
  pull_request:
  push:
    branches: [develop]
    tags: ['v*']
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm ci
      - name: Analyse statique (syntaxe JavaScript)
        run: npx --yes eslint@8 --no-eslintrc --parser-options=ecmaVersion:2022 --ignore-pattern node_modules .
      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=critical
        continue-on-error: true
      - name: Tests
        run: npm test
  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choisir le tag de l'image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "TAG=develop" >> $GITHUB_ENV
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.DOCKERHUB_USER }}/focustask:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
